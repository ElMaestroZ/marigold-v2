hypersim_train_shading_qwen_768:
  name: GenericDataset
  disp_name: hypersim_train_shading_qwen_768
  sampling_weight: 1.0
  manifest_cfg:
    name: GenericManifest
    manifest_graph:
      - LoadHypersimShadingManifest:
          base_dir: ${oc.env:HYPERSIM_SHADING_DATASET_DIR,${oc.env:DEPTH_ASSETS_DIR,./assets}/datasets/marigold_train_shading}
          split: train
          source_split: train
          selection: exclude_holdout
          holdout_samples: 200
          seed: 42
          verify_files: true
  transform:
    - ReadRGBImage:
        key: rgb_path
        name: rgb
        use_rel_dir: false
        set_as_orig_res: true
        save_orig: true
    - ReadRGBShadingNpy:
        key: shading_path
        output_key: shading_gt
        mask_key: valid_mask
    - RandomHorizontalFlipShading:
        p: 0.5
        include_keys: [rgb_norm, rgb_int, shading_gt, valid_mask]
    - ResizeRGBShading:
        height: 576
        width: 768
        rgb_keys: [rgb_norm, rgb_int]
        shading_key: shading_gt
        mask_key: valid_mask

